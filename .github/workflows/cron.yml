name: Canvas Auto Result Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and Push Result to Firebase
        run: |
          node -e '
          (async () => {
            const now = new Date();

            // IST Time formatting for key (e.g., 07_Oct_2026_14_45)
            const options = { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false };
            const formatter = new Intl.DateTimeFormat("en-GB", options);
            const parts = formatter.formatToParts(now);
            
            let day, month, year, hour, minute;
            parts.forEach(p => {
              if (p.type === "day") day = p.value;
              if (p.type === "month") month = p.value;
              if (p.type === "year") year = p.value;
              if (p.type === "hour") hour = p.value;
              if (p.type === "minute") minute = p.value;
            });

            // Round off minutes to nearest 15
            let minInt = parseInt(minute);
            let roundedMin = Math.floor(minInt / 15) * 15;
            let minStr = roundedMin < 10 ? "0" + roundedMin : "" + roundedMin;

            let timeKey = `${day}_${month}_${year}_${hour}_${minStr}`;

            let results = {};
            for (let i = 0; i < 100; i++) {
              let key = i < 10 ? "0" + i : "" + i;
              results[key] = Math.floor(1000 + Math.random() * 9000).toString();
            }

            try {
              const response = await fetch(`https://canvas2d-result-f4d7d-default-rtdb.firebaseio.com/resultsData/${timeKey}.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(results)
              });
              const text = await response.text();
              console.log("Firebase Response:", text);
            } catch (error) {
              console.error("Error pushing to Firebase:", error);
            }
          })();
          '
