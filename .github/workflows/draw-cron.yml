name: Automated Draw Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install firebase-admin node-fetch

      - name: Run Draw Script
        run: node generate-draw.js
        env:
          FIREBASE_DATABASE_URL: "https://canvas2d-result-default-rtdb.firebaseio.com/"
